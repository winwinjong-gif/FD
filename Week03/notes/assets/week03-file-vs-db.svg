<svg viewBox="0 0 720 260" xmlns="http://www.w3.org/2000/svg" font-family="'Pretendard','Apple SD Gothic Neo',sans-serif">
  <rect x="0" y="0" width="720" height="260" fill="#FAF7F0"/>

  <text x="20" y="26" font-size="13" font-weight="700" fill="#0F2747">파일로 답하기</text>
  <rect x="20" y="38" width="70" height="34" rx="6" fill="#E2E8F0" stroke="#64748B"/>
  <text x="55" y="59" font-size="11" text-anchor="middle" fill="#0F2747">CSV 1</text>
  <rect x="105" y="38" width="70" height="34" rx="6" fill="#E2E8F0" stroke="#64748B"/>
  <text x="140" y="59" font-size="11" text-anchor="middle" fill="#0F2747">CSV 2</text>
  <rect x="190" y="38" width="70" height="34" rx="6" fill="#E2E8F0" stroke="#64748B"/>
  <text x="225" y="59" font-size="11" text-anchor="middle" fill="#0F2747">CSV 3</text>
  <path d="M262 55 H300" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="302" y="38" width="80" height="34" rx="6" fill="#FCD34D" stroke="#D97706"/>
  <text x="342" y="59" font-size="11" text-anchor="middle" fill="#0F2747">합치기</text>
  <path d="M384 55 H422" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="424" y="38" width="80" height="34" rx="6" fill="#FCD34D" stroke="#D97706"/>
  <text x="464" y="59" font-size="11" text-anchor="middle" fill="#0F2747">정리하기</text>
  <path d="M506 55 H544" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="546" y="38" width="130" height="34" rx="6" fill="#FEF2F2" stroke="#DC2626"/>
  <text x="611" y="59" font-size="11" text-anchor="middle" fill="#0F2747">조건을 바꾼다</text>

  <path d="M611 74 C 611 120, 55 120, 55 76" stroke="#DC2626" stroke-width="2.5" fill="none" marker-end="url(#arrowRed)"/>
  <text x="330" y="118" font-size="11.5" font-weight="700" text-anchor="middle" fill="#DC2626">처음으로 돌아간다 — 조건 하나 바뀔 때마다 이 줄 전체를 다시</text>

  <line x1="10" y1="150" x2="710" y2="150" stroke="#CBD5E1" stroke-width="1"/>

  <text x="20" y="176" font-size="13" font-weight="700" fill="#0F2747">DB에 물어보기</text>
  <rect x="20" y="188" width="90" height="46" rx="6" fill="#0E7C7B"/>
  <text x="65" y="216" font-size="11" text-anchor="middle" fill="#fff">market_data.db</text>
  <path d="M112 211 H160" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="162" y="196" width="280" height="30" rx="6" fill="#E2E8F0" stroke="#0F2747"/>
  <text x="302" y="216" font-size="11" text-anchor="middle" fill="#0F2747" font-family="monospace">SELECT ... WHERE 조건</text>
  <path d="M444 211 H482" stroke="#64748B" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="484" y="196" width="90" height="30" rx="6" fill="#A7F3D0" stroke="#16A34A"/>
  <text x="529" y="216" font-size="11" text-anchor="middle" fill="#0F2747">답</text>

  <text x="600" y="216" font-size="11.5" font-weight="700" fill="#16A34A">조건이 바뀌어도 이 한 줄만 바뀐다</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748B"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#DC2626"/>
    </marker>
  </defs>
</svg>
