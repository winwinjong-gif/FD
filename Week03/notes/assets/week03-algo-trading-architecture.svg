<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0b0f19; }
      .card { fill: #131b2e; stroke: #1e293b; stroke-width: 1.2; rx: 8px; }
      .box { fill: #1a233a; stroke: #334155; stroke-width: 1; rx: 6px; }
      .t-pri { fill: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
      .t-sec { fill: #94a3b8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; }
      .t-hl-blue { fill: #60a5fa; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
      .t-hl-green { fill: #34d399; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
      .t-hl-amber { fill: #fbbf24; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
      .t-hl-purple { fill: #c084fc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; }
      .arr { stroke-width: 1.8; stroke-dasharray: 5,4; fill: none; }
      @keyframes dashFlow { to { stroke-dashoffset: -18; } }
      .anim-flow { animation: dashFlow 1.2s linear infinite; }
      @media (prefers-color-scheme: light) {
        .bg { fill: #f8fafc; }
        .card { fill: #ffffff; stroke: #cbd5e1; }
        .box { fill: #f1f5f9; stroke: #cbd5e1; }
        .t-pri { fill: #0f172a; }
        .t-sec { fill: #475569; }
        .t-hl-blue { fill: #2563eb; }
        .t-hl-green { fill: #059669; }
        .t-hl-amber { fill: #d97706; }
        .t-hl-purple { fill: #7c3aed; }
      }
    </style>
    <marker id="arr-b" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0,0 6,3 0,6" fill="#3b82f6"/></marker>
    <marker id="arr-g" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0,0 6,3 0,6" fill="#10b981"/></marker>
    <marker id="arr-p" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><polygon points="0,0 6,3 0,6" fill="#8b5cf6"/></marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="100%" height="100%" class="bg" rx="12"/>

  <!-- Main Title Header -->
  <text x="360" y="32" text-anchor="middle" class="t-pri" font-size="16">🏛️ 실전 핀테크 &amp; 퀀트 알고리즘 트레이딩 아키텍처 (with DB)</text>
  <text x="360" y="50" text-anchor="middle" class="t-sec">"왜 매번 API를 부르거나 CSV를 열지 않고, 중앙 DB에 데이터를 모아두고 쓸까?"</text>

  <!-- LAYER 1: External API World -->
  <rect x="20" y="68" width="160" height="268" class="card"/>
  <rect x="20" y="68" width="160" height="32" fill="rgba(59,130,246,0.12)" rx="8"/>
  <text x="100" y="89" text-anchor="middle" class="t-hl-blue" font-size="12">1. 외부 데이터 API</text>

  <!-- OpenDART API Box -->
  <rect x="30" y="112" width="140" height="84" class="box" stroke="#3b82f6"/>
  <text x="100" y="132" text-anchor="middle" class="t-pri" font-size="11.5">🏛️ OpenDART API</text>
  <text x="100" y="148" text-anchor="middle" class="t-hl-amber" font-size="10">⭐ 4주차 핵심 실습</text>
  <text x="100" y="165" text-anchor="middle" class="t-sec">상장사 분기 재무제표</text>
  <text x="100" y="180" text-anchor="middle" class="t-sec">PER · ROE · 사업보고서</text>

  <!-- KRX / Price API Box -->
  <rect x="30" y="210" width="140" height="84" class="box" stroke="#3b82f6"/>
  <text x="100" y="230" text-anchor="middle" class="t-pri" font-size="11.5">📈 거래소 / 증권사 시세</text>
  <text x="100" y="246" text-anchor="middle" class="t-hl-blue" font-size="10">FDR / KIS 시세 API</text>
  <text x="100" y="263" text-anchor="middle" class="t-sec">매일 장마감 일별 종가</text>
  <text x="100" y="278" text-anchor="middle" class="t-sec">실시간 체결 틱 &amp; 호가</text>

  <text x="100" y="318" text-anchor="middle" class="t-sec" font-size="9.5">주기적 일괄 요청 (배치)</text>

  <!-- Connector: Layer 1 -> Layer 2 -->
  <path d="M 180 154 L 216 154" stroke="#3b82f6" class="arr anim-flow" marker-end="url(#arr-b)"/>
  <path d="M 180 252 L 216 252" stroke="#3b82f6" class="arr anim-flow" marker-end="url(#arr-b)"/>

  <!-- LAYER 2: Central SSOT DB (The Core) -->
  <rect x="220" y="68" width="180" height="268" class="card" stroke="#10b981" stroke-width="1.8"/>
  <rect x="220" y="68" width="180" height="32" fill="rgba(16,185,129,0.15)" rx="8"/>
  <text x="310" y="89" text-anchor="middle" class="t-hl-green" font-size="12">2. 중앙 DB (SSOT 캐시)</text>

  <rect x="232" y="112" width="156" height="182" class="box" stroke="#10b981"/>
  <text x="310" y="134" text-anchor="middle" class="t-pri" font-size="12">🗄️ SQLite / PostgreSQL</text>
  <text x="310" y="152" text-anchor="middle" class="t-hl-green" font-size="10.5">단일 진실 공급원 (SSOT)</text>

  <line x1="242" y1="162" x2="378" y2="162" stroke="#334155"/>
  <text x="250" y="180" class="t-sec">📁 <tspan class="t-pri">companies</tspan> (기업개요)</text>
  <text x="250" y="198" class="t-sec">📁 <tspan class="t-pri">financials</tspan> (재무제표)</text>
  <text x="250" y="216" class="t-sec">📁 <tspan class="t-pri">returns</tspan> (10년치 주가)</text>
  <line x1="242" y1="226" x2="378" y2="226" stroke="#334155"/>

  <text x="310" y="244" text-anchor="middle" class="t-hl-amber" font-size="10">🛡️ 3대 고통 원천 해결</text>
  <text x="310" y="260" text-anchor="middle" class="t-sec" font-size="9.5">✔ API 호출 한도 회피</text>
  <text x="310" y="274" text-anchor="middle" class="t-sec" font-size="9.5">✔ 로컬 0.001초 응답 (지연 0)</text>
  <text x="310" y="288" text-anchor="middle" class="t-sec" font-size="9.5">✔ 완벽한 과거 재현성 보장</text>

  <text x="310" y="318" text-anchor="middle" class="t-sec" font-size="9.5">신규 1행만 덧붙임 (Append)</text>

  <!-- Connector: Layer 2 -> Layer 3 -->
  <path d="M 400 154 L 436 154" stroke="#10b981" class="arr anim-flow" marker-end="url(#arr-g)"/>
  <path d="M 400 252 L 436 252" stroke="#10b981" class="arr anim-flow" marker-end="url(#arr-g)"/>

  <!-- LAYER 3: Engines & Customer Services -->
  <rect x="440" y="68" width="160" height="268" class="card"/>
  <rect x="440" y="68" width="160" height="32" fill="rgba(139,92,246,0.12)" rx="8"/>
  <text x="520" y="89" text-anchor="middle" class="t-hl-purple" font-size="12">3. 서비스 &amp; 퀀트 엔진</text>

  <!-- Quant Python Engine -->
  <rect x="450" y="112" width="140" height="84" class="box" stroke="#8b5cf6"/>
  <text x="520" y="132" text-anchor="middle" class="t-pri" font-size="11.5">💻 내 파이썬 퀀트 전략</text>
  <text x="520" y="148" text-anchor="middle" class="t-hl-purple" font-size="10">초고속 SQL 질의</text>
  <text x="520" y="165" text-anchor="middle" class="t-sec">PER &lt; 10 팩터 스크리닝</text>
  <text x="520" y="180" text-anchor="middle" class="t-sec">골든크로스 매매 신호</text>

  <!-- Toss Securities UI -->
  <rect x="450" y="210" width="140" height="84" class="box" stroke="#8b5cf6"/>
  <text x="520" y="230" text-anchor="middle" class="t-pri" font-size="11.5">📱 토스증권 대시보드</text>
  <text x="520" y="246" text-anchor="middle" class="t-hl-purple" font-size="10">모바일 앱 화면</text>
  <text x="520" y="263" text-anchor="middle" class="t-sec">실시간 시세 + 재무지표</text>
  <text x="520" y="278" text-anchor="middle" class="t-sec">0.1초 즉시 렌더링</text>

  <text x="520" y="318" text-anchor="middle" class="t-sec" font-size="9.5">내부 DB에서 즉시 인출</text>

  <!-- Connector: Layer 3 -> Layer 4 -->
  <path d="M 600 154 L 626 154" stroke="#8b5cf6" class="arr anim-flow" marker-end="url(#arr-p)"/>

  <!-- LAYER 4: Final Execution (Order) -->
  <rect x="630" y="68" width="70" height="268" class="card" stroke="#f59e0b"/>
  <rect x="630" y="68" width="70" height="32" fill="rgba(245,158,11,0.15)" rx="8"/>
  <text x="665" y="89" text-anchor="middle" class="t-hl-amber" font-size="11">4. 주문</text>

  <rect x="636" y="112" width="58" height="182" class="box" stroke="#f59e0b"/>
  <text x="665" y="145" text-anchor="middle" class="t-pri" font-size="10">증권사</text>
  <text x="665" y="160" text-anchor="middle" class="t-pri" font-size="10">트레이딩</text>
  <text x="665" y="175" text-anchor="middle" class="t-hl-amber" font-size="9.5">API</text>
  <text x="665" y="205" text-anchor="middle" class="t-sec" font-size="9">검증된</text>
  <text x="665" y="220" text-anchor="middle" class="t-sec" font-size="9">최종 주문</text>
  <text x="665" y="235" text-anchor="middle" class="t-sec" font-size="9">1건만</text>
  <text x="665" y="250" text-anchor="middle" class="t-hl-green" font-size="9">전송!</text>
  <text x="665" y="280" text-anchor="middle" class="t-sec" font-size="8.5">(KIS API)</text>
</svg>
